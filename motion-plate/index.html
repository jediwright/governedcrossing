:root{
  --paper:#EDE6D5; --paper-deep:#E4DCC9; --paper-light:#F3EEE3;
  --ink:#1C2340; --ink-soft:#4B5068; --thread:#B8401C; --thread-deep:#9E3616;
  --surround:#D9D0BA; --bar:#1C2340; --bar-text:#EDE6D5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --surround:#10142A; --bar:#0B0E1F; } }
:root[data-theme="dark"]{ --surround:#10142A; --bar:#0B0E1F; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--surround);display:flex;flex-direction:column;font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;color:var(--ink);overflow:hidden}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
#stage{display:block;max-width:100%;max-height:100%;aspect-ratio:16/9;width:auto;height:100%;background:var(--paper);box-shadow:0 1px 0 rgba(28,35,64,.25),0 18px 50px -18px rgba(16,20,42,.55)}
@media (max-aspect-ratio:16/9){#stage{width:100%;height:auto}}
body.export #wrap{padding:0} body.export #bar{display:none} body.export #stage{box-shadow:none}
#bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--bar);color:var(--bar-text);font:500 12px/1 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
#bar button{appearance:none;border:1px solid rgba(237,230,213,.45);background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:9px 14px;cursor:pointer;min-width:84px}
#bar button:hover{background:rgba(237,230,213,.12)}
#bar button:focus-visible,#scrub:focus-visible{outline:2px solid #E0703F;outline-offset:3px}
#scrub{flex:1;min-width:60px;appearance:none;height:22px;background:transparent;cursor:pointer;margin:0}
#scrub::-webkit-slider-runnable-track{height:2px;background:repeating-linear-gradient(90deg,rgba(237,230,213,.75) 0 8px,transparent 8px 13px)}
#scrub::-moz-range-track{height:2px;background:repeating-linear-gradient(90deg,rgba(237,230,213,.75) 0 8px,transparent 8px 13px)}
#scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;margin-top:-6px;background:#E0703F;border:2px solid var(--bar-text)}
#scrub::-moz-range-thumb{width:10px;height:10px;background:#E0703F;border:2px solid var(--bar-text);border-radius:0}
#chap{min-width:9.5em} #time{min-width:6.5em;text-align:right;opacity:.75}
@media (max-width:640px){#chap{display:none}#bar{gap:10px;padding:8px 12px}}

svg text{font-kerning:normal}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase}
.kv{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px}
.disp{font-family:'Gloock',Didot,Georgia,serif}
.sans{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
.ink{fill:var(--ink)} .soft{fill:var(--ink-soft)} .rust{fill:var(--thread-deep)}
.a{opacity:0;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:1;stroke-dashoffset:1;fill:none}
</style>

<title id="ttl">The Governed Crossing</title>
<desc id="dsc">An animated diagram. One entry leaves a person's own system for the AT Protocol network. Its scope is declared, a grant authorizes it, a gate checks the grant at the moment of crossing, and signed intent and completion records are left behind. The originals stay with the person and the network carries copies. A second attempt without a grant is blocked, recorded privately, and never published.</desc>
